name: Feature Request
description: Suggest an idea or enhancement for Airbase
title: '[FEATURE] '
labels: ['enhancement']
assignees: ''

body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Proposal
      description: What feature would you like to see added to Airbase?
      placeholder: It would be awesome if Airbase could...
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Rationale
      description: Why is this feature needed or useful to users?
    validations:
      required: false
